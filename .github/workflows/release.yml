name: Publish APKs

on:
  push:
    branches: ["claude/biggest-project-prep-tkgf8p"]
  workflow_dispatch:

# Required to create and update the release these APKs are attached to.
permissions:
  contents: write

concurrency:
  group: publish-apks
  # Queue rather than cancel. Cancelling meant a run started moments earlier
  # killed the one before it, and the release link was left pointing at
  # whichever build happened to survive — twice at an older commit than the
  # branch head. Queued runs finish in order, so the newest is the one that
  # lands last.
  cancel-in-progress: false

jobs:
  windows:
    name: Build the Windows installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No lockfile is committed, so this resolves the pinned versions in
      # package.json rather than whatever is newest today.
      - name: Install
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build
        working-directory: desktop
        env:
          # Nothing here is signed, and electron-builder should not go looking
          # for a certificate it will not find.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: desktop/dist/MAURIMAX-Setup.exe
          if-no-files-found: error

  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    needs: [windows]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Tests run here too, not only in the Android workflow. This job is the
      # one that moves the public download link, and it must never point at a
      # build that failed its checks just because it happens to compile.
      - name: Test and assemble
        run: ./gradlew test :app:mobile:assembleDebug :app:tv:assembleDebug --console=plain

      - name: Name the files for humans
        run: |
          mkdir -p dist
          cp app/mobile/build/outputs/apk/debug/*.apk dist/maurimax-phone.apk
          cp app/tv/build/outputs/apk/debug/*.apk     dist/maurimax-tv.apk
          ls -la dist

      - name: Collect the Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist

      # One release, always replaced, so the download URL never changes. A
      # customer's link keeps working while the build behind it moves on.
      - name: Publish to the rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            dist/maurimax-phone.apk \
            dist/maurimax-tv.apk \
            dist/MAURIMAX-Setup.exe \
            --title "MAURIMAX — latest build" \
            --notes "Build ${{ github.sha }}.

Android builds are debug, unsigned for the Play Store. The Windows installer is unsigned, so SmartScreen will warn on first run: More info, then Run anyway." \
            --latest
