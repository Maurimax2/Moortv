name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and assemble
        shell: bash
        run: |
          set -o pipefail
          ./gradlew test :app:mobile:assembleDebug :app:tv:assembleDebug \
            --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      # Gradle buries compiler errors under a few hundred lines of stack trace.
      # This runs last on failure, so the errors are the final thing in the log.
      - name: Compiler errors
        if: failure()
        shell: bash
        run: |
          echo "──────── compile errors ────────"
          grep -E "^(e: |w: .*: error:)" "$RUNNER_TEMP/gradle.log" | head -60 || echo "(none matched)"
          echo "──────── what went wrong ────────"
          sed -n '/^\* What went wrong:/,/^\* Try:/p' "$RUNNER_TEMP/gradle.log" | head -40 || true

      - name: Upload mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: maurimax-mobile-debug
          path: app/mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: maurimax-tv-debug
          path: app/tv/build/outputs/apk/debug/*.apk
          if-no-files-found: error
