name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Build mobile APK
        run: ./gradlew :app:mobile:assembleDebug --stacktrace

      - name: Build TV APK
        run: ./gradlew :app:tv:assembleDebug --stacktrace

      # These two artifacts are the installable app. Download from the run summary,
      # then sideload with `adb install -r <file>.apk`.
      - name: Upload mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: maurimax-mobile-debug
          path: app/mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: maurimax-tv-debug
          path: app/tv/build/outputs/apk/debug/*.apk
          if-no-files-found: error
